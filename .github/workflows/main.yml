name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Files ko sahi jagah rakho
        run: |
          mkdir -p app/src/main/java/com/example/minilauncher
          mv MainActivity.kt app/src/main/java/com/example/minilauncher/
          mv AndroidManifest.xml app/src/main/
          mv app.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MiniLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
